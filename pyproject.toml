[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-memory"
version = "0.1.0"
description = "Local-first memory and RAG module for Jarvis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.5",
  "pypdf>=4.2.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]

ui = [
  "streamlit>=1.40.0",
  "httpx>=0.27.0",
]

embeddings = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
jarvis-memory = "jarvis_memory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["jarvis_memory*"]
